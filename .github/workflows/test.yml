name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # 의존성이 없어서 설치 단계 없이 바로 돌린다 (테스트는 Node 내장 모듈만 쓴다)
      - name: 테스트 실행
        run: npm test
